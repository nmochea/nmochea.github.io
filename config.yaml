    Title: "Neil Mark Ochea 🕷"
    Content: |-
      I just love exploring security vulnerabilities and hacking things.<br><br>
      **Bug Bounty**: [HackerOne Ranked #2](https://hackerone.com/leaderboard/country?year=2023&quarter=1&owasp=a1&country=PH&assetType=WEB_APP&tab=bbp&userTypeTab=individual) | [Bugrap Ranked #6](https://bugrap.io/whiteHats) | [Cybozu Ranked #8](https://cy-psirt.viewer.kintoneapp.com/public/point-ranking)<br>
      **CVES**: CVE-2025-15569, CVE-2026-2974
  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/in/nmochea"
    - name: github
      url: "https://github.com/nmochea"
    - name: x
      url: "https://x.com/nmochea"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

menu:
  main:
    - identifier: 0xnmo
      name: "⌂ 0xnmo"
